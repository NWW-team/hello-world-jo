<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello, Vibecoding!</title>
  <style>
    :root {
      --bg: #0f172a;
      --bg-card: #1e293b;
      --accent: #38bdf8;
      --accent-2: #a78bfa;
      --text: #e2e8f0;
      --text-dim: #94a3b8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, #1e293b, var(--bg));
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--text);
      padding: 24px;
    }

    .card {
      background: var(--bg-card);
      border-radius: 16px;
      padding: 48px 40px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(148, 163, 184, 0.15);
    }

    .badge {
      display: inline-block;
      font-size: 13px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent);
      background: rgba(56, 189, 248, 0.1);
      padding: 6px 14px;
      border-radius: 999px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 2.2rem;
      margin: 0 0 12px;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    p {
      color: var(--text-dim);
      line-height: 1.6;
      margin: 0 0 28px;
    }

    button {
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      color: #0f172a;
      font-weight: 600;
      font-size: 15px;
      border: none;
      border-radius: 10px;
      padding: 12px 24px;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(56, 189, 248, 0.25);
    }

    #output {
      margin-top: 20px;
      font-size: 14px;
      color: var(--accent);
      min-height: 20px;
    }

    footer {
      margin-top: 32px;
      font-size: 12px;
      color: #475569;
    }
  </style>
</head>
<body>
  <main class="card">
    <span class="badge">Vibecoding demo</span>
    <h1>Hello, World! 👋</h1>
    <p>
      Dit is een piepklein voorbeeldproject om te laten zien hoe je met
      "vibecoden" — samen met een AI in een lopend gesprek bouwen — snel
      van niets naar iets werkends gaat.
    </p>
    <button id="greetBtn">Zeg hallo</button>
    <div id="output"></div>
    <footer>Gebouwd met HTML, CSS &amp; een beetje JavaScript.</footer>
  </main>

  <script>
    const button = document.getElementById("greetBtn");
    const output = document.getElementById("output");
    const messages = [
      "Hallo daar! 🎉",
      "Vibecoden werkt! ✨",
      "Nog een keer? 😄",
      "Je bent hier goed bezig! 🚀"
    ];
    let i = 0;

    button.addEventListener("click", () => {
      output.textContent = messages[i % messages.length];
      i++;
    });
  </script>
</body>
</html>
